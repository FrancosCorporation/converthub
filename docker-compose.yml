services:
  converthub:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3700}:${PORT:-3700}"
    environment:
      PORT: ${PORT:-3700}
      CONVERTHUB_DB: /data/converthub.db
      CONVERTHUB_UPLOADS: /data/uploads
    volumes:
      - dados:/data
    restart: unless-stopped

volumes:
  dados:
